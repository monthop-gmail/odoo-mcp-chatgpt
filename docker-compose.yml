name: odoo-mcp-chatgpt

# MCP server สำหรับ Odoo + ท่อของ OpenAI
#
# ทั้งสอง service อยู่ในวงเดียวกับ Odoo และเปิดแค่ขาออก — Odoo ไม่ต้อง public
# ไม่ต้องเปิด inbound port ให้ใคร

services:
  mcp-server:
    build: ./mcp-server
    image: local/odoo-mcp:1.0
    container_name: odoo-mcp-chatgpt-server
    restart: unless-stopped
    environment:
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:?ตั้งใน .env ก่อน}
      - ODOO_SERVERS=${ODOO_SERVERS:-}
      - ODOO_URL=${ODOO_URL:-}
      - ODOO_DB=${ODOO_DB:-}
      - ODOO_USERNAME=${ODOO_USERNAME:-}
      - ODOO_PASSWORD=${ODOO_PASSWORD:-}
      - BLOCKED_MODELS=${BLOCKED_MODELS:-}
      - ALLOWED_MODELS=${ALLOWED_MODELS:-}
      - UVICORN_LOG_LEVEL=${LOG_LEVEL:-info}
    # เข้า network ของ Odoo ตรง ๆ ถ้า Odoo เป็น container ในเครื่องเดียวกัน
    # แบบนี้ Odoo ไม่ต้อง expose port ออกมาเลย เรียกด้วยชื่อ container ได้
    # ตั้ง ODOO_NETWORK ใน .env ให้ตรงกับ network ที่ Odoo ใช้
    #
    # host.docker.internal มีไว้เผื่อ Odoo รันนอก docker บน host เดียวกัน
    # (ต้องให้ Odoo ผูก 0.0.0.0 หรือ IP ของ bridge ไม่ใช่ 127.0.0.1)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - odoo
    # ผูก localhost เท่านั้น — ท่อคุยผ่าน docker network ไม่ต้องใช้พอร์ตนี้
    ports:
      - "${MCP_BIND_ADDR:-127.0.0.1}:${MCP_HOST_PORT:-8100}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # tunnel ไม่ต้องเข้า network ของ Odoo — มันคุยกับ mcp-server เท่านั้น
  tunnel-client:
    image: ghcr.io/openai/tunnel-client:${TUNNEL_CLIENT_VERSION:-v0.0.12}
    container_name: odoo-mcp-chatgpt-tunnel
    restart: unless-stopped
    depends_on:
      mcp-server:
        condition: service_healthy
    environment:
      - CONTROL_PLANE_TUNNEL_ID=${CONTROL_PLANE_TUNNEL_ID:?ตั้งใน .env ก่อน}
      - CONTROL_PLANE_API_KEY=${CONTROL_PLANE_API_KEY:?ตั้งใน .env ก่อน}
      - MCP_SERVER_URL=http://mcp-server:8000/mcp
      # ชื่อตัวแปรที่ tunnel-client อ่านคือ MCP_EXTRA_HEADERS
      # ใส่ Bearer ให้อัตโนมัติเมื่อ MCP_AUTH_TOKEN ถูกตั้งไว้
      # ต้องใส่ quote — ค่ามี ": " ซึ่ง YAML จะอ่านเป็น map ถ้าไม่ครอบ
      - "MCP_EXTRA_HEADERS=${MCP_AUTH_TOKEN:+Authorization: Bearer ${MCP_AUTH_TOKEN}}"
      - MCP_STARTUP_WAIT_TIMEOUT=60s
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      # health/metrics/admin UI ฟังในคอนเทนเนอร์ แต่ publish แค่ loopback
      - HEALTH_LISTEN_ADDR=:8080
      - ALLOW_REMOTE_UI=true
    ports:
      - "127.0.0.1:${TUNNEL_HEALTH_PORT:-8101}:8080"

  # ตรวจว่าท่อต่อติดโดยไม่ต้องพึ่ง MCP server ของเรา
  tunnel-stub:
    profiles: ["stub"]
    image: ghcr.io/openai/tunnel-client:${TUNNEL_CLIENT_VERSION:-v0.0.12}
    container_name: odoo-mcp-chatgpt-stub
    restart: "no"
    command: ["--embedded-mcp-stub"]
    environment:
      - CONTROL_PLANE_TUNNEL_ID=${CONTROL_PLANE_TUNNEL_ID:?}
      - CONTROL_PLANE_API_KEY=${CONTROL_PLANE_API_KEY:?}
      - LOG_LEVEL=${LOG_LEVEL:-info}

networks:
  odoo:
    name: ${ODOO_NETWORK:-odoo19-mcp-test_default}
    external: true
